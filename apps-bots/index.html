<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bots / Apps — Your Dashboards — Rival Eclipse</title>
<meta name="description" content="Your Rival Eclipse bot dashboards — manage Bouncer, Chat-Mate, Tim, VibeCheck, and JayRain. Needs a linked Discord account.">
<link rel="stylesheet" href="/style.css">
<style>.beta-pill{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;color:#0a0a0f;background:#ffd54a;border-radius:999px;padding:2px 9px;margin-right:8px;vertical-align:2px}</style></head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <div class="wrap">
    <div class="crumb"><a href="/">← Rival Eclipse</a></div>
    <h1 class="page-title">Bots / Apps — Your Dashboards</h1>
    <p class="page-sub" id="gate-sub">Checking your account…</p>
    <div class="grid" id="dash-grid" style="display:none"></div>
    <p class="page-sub" style="margin-top:18px">Just browsing? <a href="/products/">See everything we offer</a> — no account needed.</p>
  </div>
</main>
<footer>
  <div class="wrap">
    <div>© 2026 Rival Eclipse. All things under rivaleclipse.dev.</div>
    <nav>
      <a href="/">Home</a>
      <a href="/sign-in/">Sign in</a>
      <a href="/client/">Client Portal</a>
      <a href="https://bouncer.rivaleclipse.dev/terms">Terms of Service</a>
      <a href="https://bouncer.rivaleclipse.dev/privacy">Privacy Policy</a>
    </nav>
  </div>
</footer>
<script src="/sky.js"></script>
<script type="module">
import { session, packages } from '/auth.js';
import { hasDiscord, goBlocked } from '/_lib/gates.js';

// Gateway: bot dashboards need a signed-in account WITH a linked Discord.
// Anything missing routes through the friendly /blocked/ interstitial,
// which returns here once the requirement is met.
const s = await session().catch(() => null);
if (!s) goBlocked('signin', '/apps-bots/');
if (!hasDiscord(s)) goBlocked('discord', '/apps-bots/');

const BOTS = [
  { name: 'Bouncer', dashboard_url: 'https://bouncer.rivaleclipse.dev/dashboard/', description: 'Anti-scam bouncer for your server — quarantine, verification, scam intel.', icon: '/bouncer-bot.webp', tag: 'Bouncer Bot (beta) — Anti-Scam Network' },
  { name: 'Chat-Mate', dashboard_url: 'https://chatmate.rivaleclipse.dev/dashboard/', description: 'Channel content enforcement and pattern learning.', icon: '/chat-mate.webp', tag: 'Chat-Mate (beta) — Server Housekeeping' },
  { name: 'Tim', dashboard_url: 'https://tim.rivaleclipse.dev/dashboard/', description: 'AI chatbot for your server — bring your own AI key.', icon: '/tim.webp', tag: 'Tim (beta) — AI Chatbot' },
  { name: 'VibeCheck', dashboard_url: 'https://vibecheck.rivaleclipse.dev/dashboard/', description: 'Community pulse surveys, rep, and vibe ratings.', icon: '/vibecheck.webp', tag: 'VibeCheck (beta) — Community & Reputation' },
  { name: 'FreeMium JayRain', dashboard_url: 'https://freemiumjayrain.rivaleclipse.dev/dashboard/', description: 'Music bot — nodes, sharing, Mobile tier.', icon: '/jayrain.webp', tag: 'FreeMium JayRain (beta) — Music Bot' },
];

let pkgs = [];
try { pkgs = await packages(); } catch { /* fall back to the static list */ }
const list = (pkgs && pkgs.length ? pkgs : BOTS).map((p) => {
  const known = BOTS.find((b) => b.dashboard_url === p.dashboard_url) || {};
  return {
    name: p.name, dashboard_url: p.dashboard_url,
    description: p.description || known.description || '',
    icon: known.icon || '', tag: known.tag || p.name,
  };
});

document.getElementById('gate-sub').textContent = 'Manage your Discord servers on each bot — signed in, Discord linked.';
const grid = document.getElementById('dash-grid');
grid.style.display = '';
grid.innerHTML = list.map((p) => `
  <a class="card" href="${p.dashboard_url}">
    ${p.icon ? `<div class="icon"><img src="${p.icon}" alt="${p.name} icon"></div>` : ''}
    <span class="badge dash">🔗 discord linked</span>
    <h2>${p.tag}</h2><p>${p.description}</p>
    <div class="go">Open dashboard <span>→</span></div>
  </a>`).join('');
</script>
<script src="/assistant.js"></script>
<script src="/_lib/menu.js"></script>
</body>
</html>
